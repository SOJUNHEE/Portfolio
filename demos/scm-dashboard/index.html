<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROROBELL SCM 운영 대시보드 — 지원용 포트폴리오</title>
  <meta name="description" content="(주)로로벨 SCM 물류·재고 관리 직무 지원용 포트폴리오. 카페24·스마트스토어·사방넷 B2C 출고와 쿠팡·컬리·올리브영 B2B 납품, 수출 서류, 재고·정산 검증, 제품별 매출을 한 화면에서 보는 운영 대시보드 (제품명·가격은 공식몰 공개 정보, 모든 수치는 가상 데이터)">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/static/images/portfolio/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" integrity="sha384-ei/b2Mz3F5J8nqTvpKS89CkzDCuD7Cc+/F+OsaPUKItzHgLNKnGq3rjtYq/B7RnO" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="화면 이동">
      <div class="brand">
        <div class="brand-name">ROROBELL</div>
        <div class="brand-sub">SCM 운영 대시보드 — 지원용 포트폴리오</div>
      </div>
      <ul class="nav" id="nav"></ul>
      <dl class="sidebar-foot" id="sidebarFoot"></dl>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <div class="page-title">
            <span class="eyebrow" id="pageEyebrow"></span>
            <h1><span id="pageTitle"></span><span class="duty" id="pageDuty"></span></h1>
          </div>
          <form class="filters" id="filters">
            <div class="field">
              <label for="fPeriod">기간</label>
              <select id="fPeriod">
                <option value="7d">최근 7일</option>
                <option value="30d">최근 30일</option>
                <option value="90d" selected>최근 3개월</option>
                <option value="180d">최근 6개월</option>
                <option value="365d">최근 12개월</option>
                <option value="custom">직접 선택</option>
              </select>
            </div>
            <div class="custom-range" id="customRange">
              <div class="field">
                <label for="fFrom">시작일</label>
                <input type="date" id="fFrom">
              </div>
              <div class="field">
                <label for="fTo">종료일</label>
                <input type="date" id="fTo">
              </div>
            </div>
            <div class="field">
              <label for="fChannel">채널</label>
              <select id="fChannel"></select>
            </div>
            <div class="field">
              <label for="fProduct">상품</label>
              <select id="fProduct"></select>
            </div>
            <div class="field">
              <label class="sr-only" for="fReset">필터 초기화</label>
              <button type="button" class="btn" id="fReset">초기화</button>
            </div>
          </form>
        </div>
        <p class="scope-line" id="scopeLine"></p>
      </header>

      <main class="view" id="view" tabindex="-1">
        <p class="loading">가상 데이터를 생성하고 있습니다…</p>
      </main>

      <footer class="disclaimer">
        <p><strong>(주)로로벨 SCM 물류·재고 관리 직무 지원을 위해 개인이 만든 포트폴리오입니다. 로로벨과 제휴하거나 로로벨이 제공한 자료가 아닙니다.</strong></p>
        <p>제품명·판매가·소비자가는 로로벨 공식몰(rorobell.com, 2026-10-12 확인), 채널과 업무는 채용공고 공개 내용입니다. 주문·발주·재고·매출·정산 등 모든 수치와 3PL 센터·납품처 이름은 가상 데이터이며 로로벨의 실제 수치가 아닙니다.</p>
      </footer>
    </div>
  </div>

  <!-- 포트폴리오 사이트 내장본: Chart.js 4.4.1을 로컬로 포함하고(CSP script-src 'self'), 인라인 onsubmit 대신 embed.js 사용 -->
  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/embed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
