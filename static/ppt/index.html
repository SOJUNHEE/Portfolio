<!doctype html>
<html lang="ko">

<body>
  <div class="viewer">
    <header class="v-top"><div class="v-top-in">
      <p class="v-title">소준희 포트폴리오<span id="proj-name">PROJECT 1 · 다품종 3PL 운영 대시보드 · 한 줄 요약</span></p>
      <nav class="v-links" aria-label="파일과 사이트">

        <a class="primary" href="/">웹 포트폴리오</a>

  <dialog class="zoom" id="zoom" aria-label="화면 크게 보기">

      <div class="zoom-bar"><button type="button" id="zoom-close">닫기 ✕</button><button type="button" id="zoom-next">다음 장 →</button></div>
      <div class="zoom-scroll"><img id="zoom-img" alt=""></div>
      <p class="zoom-cap" id="zoom-cap"></p>
    </div>

  <script src="slides.js"></script>
  <script src="deck.js"></script>
