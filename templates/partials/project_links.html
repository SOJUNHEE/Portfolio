{% if project.live_url or project.github_url or project.external_url %}<div class="actions project-links">{% for key, label in [('live_url','Live Demo'),('github_url','GitHub'),('external_url','Website')] %}{% if project[key] %}<a class="button secondary small" href="{{ project[key] }}" target="_blank" rel="noopener noreferrer">{{ label }} <span aria-hidden="true">↗</span><span class="sr-only">(새 창)</span></a>{% endif %}{% endfor %}</div>{% endif %}
